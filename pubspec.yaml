name: qrs_dart
description: >-
  Dart port of Qrs (qifi-dev/qrs): stream arbitrary data through multiple QR
  codes using Luby Transform fountain codes, with uqr-compatible QR rendering.
version: 0.2.1
repository: https://github.com/SimonShiki/qrs-dart
issue_tracker: https://github.com/SimonShiki/qrs-dart/issues

environment:
  sdk: ^3.9.0

dependencies:
  archive: ^4.5.2
  crypto: ^3.0.6
  image: ^4.12.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  zxing2: ^0.2.4
