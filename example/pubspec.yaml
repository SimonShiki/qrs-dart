name: qrs_dart_example
description: All-platform example app that verifies the qrs_dart package by sending and receiving files as animated QR code streams.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  qrs_dart:
    path: ../
  material_ui: ^1.4.0
  m3e_core: ^1.1.4
  file_picker: ^13.1.0
  mobile_scanner: ^7.4.2
  zxing2: ^0.2.4
  image: ^4.12.0
  signals: ^7.1.0
  signals_flutter: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
