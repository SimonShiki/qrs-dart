name: CI

on:
  push:
    branches: [trunk]
  pull_request:
  # Lets the example be redeployed without pushing a new commit.
  workflow_dispatch:

# Least privilege by default; the deploy job opts into what Pages needs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Package
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
          flutter test

  # Publishes the example app to GitHub Pages, but only from trunk and only
  # after the tests above pass.
  deploy-example:
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/trunk')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build the example for its project page
        working-directory: example
        run: |
          flutter pub get
          flutter build web --release \
            --base-href "/${GITHUB_REPOSITORY#*/}/"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web
      - id: deployment
        uses: actions/deploy-pages@v4
